<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPOTLESS SPIN LAUNDRY POS</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f0f7f3;color:#183b30}
header{background:#087653;color:white;text-align:center;padding:22px 10px}
main{max-width:800px;margin:auto;padding:12px}
.card{background:white;padding:16px;margin:12px 0;border-radius:12px}
label{display:block;font-weight:bold;margin-top:12px;font-size:14px}
input,select,textarea,button{width:100%;padding:12px;margin-top:5px;font:inherit;border-radius:8px}
input,select,textarea{border:1px solid #ccc;background:white}
button{background:#087653;color:white;border:0;font-weight:bold}
.secondary{background:#e3eee8;color:#183b30}
.danger{background:#a83232}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item,.order{border:1px solid #d7e2dc;border-radius:9px;padding:12px;margin:10px 0}
.total{font-size:23px;color:#087653;font-weight:bold;margin:15px 0}
.small{font-size:13px;color:#53675d}
@media(max-width:480px){.row{grid-template-columns:1fr}}
</style>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#168447">
<meta name="mobile-web-app-capable" content="yes">
</head>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js");
  });
}
</script>
 <body>
<header>
<h1>SPOTLESS SPIN</h1>
<div>LAUNDRY W.L.L.</div>
<div>LAUNDRY POS • BAHRAIN</div>
</header>
<main>
<section class="card">
<h2>New Laundry Order</h2>
<form id="orderForm">
<label>Customer name *</label>
<input id="customer" required placeholder="Customer name">
<label>Phone / WhatsApp</label>
<input id="phone" type="tel" placeholder="Phone number">
<label>Service</label>
<select id="service">
<option>Wash & Fold</option>
<option>Wash & Iron</option>
<option>Ironing</option>
<option>Dry Cleaning</option>
<option>Blanket / Duvet Cleaning</option>
</select>
<h3>Clothing & Household Items</h3>
<div id="items"></div>
<button type="button" id="addItem" class="secondary">+ ADD ITEM</button>
<div class="total" id="total">Total: BHD 0.000</div>
<div class="row">
<div><label>Payment received (BHD)</label><input id="paid" type="number" min="0" step="0.001" value="0" required></div>
<div><label>Promised date</label><input id="due" type="date"></div>
</div>
<label>Order status</label>
<select id="status">
<option>Received</option><option>Processing</option><option>Ready</option><option>Delivered</option>
</select>
<label>Notes</label>
<textarea id="notes" rows="2" placeholder="Special instructions"></textarea>
<button type="submit">SAVE ORDER</button>
</form>
</section>

<section class="card">
<h2>View Orders</h2>
<input id="search" placeholder="Search customer or phone">
<div class="row">
<button type="button" id="allBtn">ALL ORDERS</button>
<button type="button" id="balanceBtn" class="secondary">BALANCE DUE</button>
</div>
<div id="orders"></div>
</section>

<section class="card">
<h2>Business Summary</h2>
<div id="summary">No orders yet.</div>
<p class="small">Orders are saved in this browser on this device only. They do not sync to other phones. Keep a separate backup of business records.</p>
</section>
</main>

<script>
const catalog=[
["Shirt",0.500],["T-Shirt",0.400],["Trouser",0.700],
["Jeans",0.800],["Shorts",0.400],["Thobe / Kandura",1.000],
["Suit - 2 Piece",2.000],["Suit - 3 Piece",2.500],
["Jacket",1.500],["Dress",1.500],["Abaya",1.000],
["Skirt",0.700],["School Uniform",0.700],
["Bedsheet",1.000],["Pillow Cover",0.300],["Pillow",1.000],
["Towel",0.300],["Blanket",2.000],["Duvet",3.000],
["Curtain",1.500],["Carpet",3.000],["Other Item",1.000]
];

const $=id=>document.getElementById(id);
const money=n=>"BHD "+Number(n||0).toFixed(3);
let orders=[];
let balanceOnly=false;
let nextId=1;

try {
 orders=JSON.parse(localStorage.getItem("spotlessOrders")||"[]");
 if(!Array.isArray(orders)) orders=[];
} catch(e) { orders=[]; }

function persist(){
 try {
  localStorage.setItem("spotlessOrders",JSON.stringify(orders));
  return true;
 } catch(e) {
  alert("Saving failed. Your browser may not have enough storage.");
  return false;
 }
}

function addItem(name="Shirt",qty=1,price=null){
 const box=document.createElement("div");
 box.className="item";
 const options=catalog.map(x=>'<option value="'+x[0]+'">'+x[0]+'</option>').join("");
 box.innerHTML=
  '<label>Item</label><select class="itemName">'+options+'</select>'+
  '<div class="row"><div><label>Quantity</label><input class="itemQty" type="number" min="1" step="1" value="'+qty+'"></div>'+
  '<div><label>Price per item (BHD)</label><input class="itemPrice" type="number" min="0" step="0.001"></div></div>'+
  '<p class="small lineTotal"></p><button type="button" class="danger remove">REMOVE ITEM</button>';
 $("items").appendChild(box);

 const sel=box.querySelector(".itemName");
 const q=box.querySelector(".itemQty");
 const p=box.querySelector(".itemPrice");
 sel.value=name;
 const defaultPrice=catalog.find(x=>x[0]===name);
 p.value=price===null?(defaultPrice?defaultPrice[1]:0):price;

 function update(){
  const qty=Math.max(0,Number(q.value)||0);
  const priceValue=Math.max(0,Number(p.value)||0);
  box.querySelector(".lineTotal").textContent="Line total: "+money(qty*priceValue);
  updateTotal();
 }
 sel.addEventListener("change",()=>{
  const found=catalog.find(x=>x[0]===sel.value);
  p.value=found?found[1]:"0";
  update();
 });
 q.addEventListener("input",update);
 p.addEventListener("input",update);
 box.querySelector(".remove").addEventListener("click",()=>{
  box.remove();updateTotal();
 });
 update();
}

function readItems(){
 return Array.from($("items").querySelectorAll(".item")).map(box=>({
  name:box.querySelector(".itemName").value,
  qty:Math.floor(Number(box.querySelector(".itemQty").value)||0),
  price:Math.max(0,Number(box.querySelector(".itemPrice").value)||0)
 })).filter(x=>x.qty>0);
}

function updateTotal(){
 const total=readItems().reduce((s,x)=>s+x.qty*x.price,0);
 $("total").textContent="Total: "+money(total);
 return total;
}

function safe(s){
 return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

$("addItem").addEventListener("click",()=>addItem());
$("orderForm").addEventListener("submit",e=>{
 e.preventDefault();
 const items=readItems();
 if(!items.length){alert("Please add at least one item.");return;}
 const total=items.reduce((s,x)=>s+x.qty*x.price,0);
 const paid=Number($("paid").value)||0;
 if(paid<0||paid>total){alert("Payment must be between zero and the total.");return;}

 const order={
  id:Date.now(),
  customer:$("customer").value.trim(),
  phone:$("phone").value.trim(),
  service:$("service").value,
  items:items,
  total:total,
  paid:paid,
  due:$("due").value,
  status:$("status").value,
  notes:$("notes").value.trim(),
  created:new Date().toLocaleString()
 };
 orders.push(order);
 if(!persist()){orders.pop();return;}
 $("orderForm").reset();
 $("items").innerHTML="";
 addItem();
 $("paid").value="0";
 $("status").value="Received";
 updateTotal();
 renderOrders();
 alert("Order saved successfully!");
});

function renderOrders(){
 const query=$("search").value.trim().toLowerCase();
 const list=orders.filter(o=>{
  const matches=(o.customer+" "+o.phone+" "+o.id).toLowerCase().includes(query);
  return matches&&(!balanceOnly||o.total>o.paid);
 }).slice().reverse();
 $("orders").innerHTML="";

 if(!list.length){
  $("orders").textContent="No matching orders found.";
 }

 list.forEach(o=>{
  const box=document.createElement("div");
  box.className="order";
  const itemLines=(o.items||[]).map(i=>
   safe(i.name)+" × "+i.qty+" — "+money(i.qty*i.price)
  ).join("<br>");

  box.innerHTML=
   '<h3>Order '+String(o.id).slice(-6)+' — '+safe(o.customer)+'</h3>'+
   '<p>Phone: '+safe(o.phone||"Not provided")+'</p>'+
   '<p>Service: '+safe(o.service)+'</p>'+
   '<p>'+itemLines+'</p>'+
   '<p><b>Total: '+money(o.total)+'</b></p>'+
   '<p>Paid: '+money(o.paid)+' | Balance: '+money(o.total-o.paid)+'</p>'+
   '<p>Due date: '+safe(o.due||"Not set")+'</p>'+
   '<p>Notes: '+safe(o.notes||"None")+'</p>'+
   '<label>Update status</label>'+
   '<select class="orderStatus"><option>Received</option><option>Processing</option><option>Ready</option><option>Delivered</option></select>'+
   '<label>Update total payment received (BHD)</label>'+
   '<input class="orderPaid" type="number" min="0" step="0.001">'+
   '<button type="button" class="update">SAVE UPDATES</button>'+
   '<button type="button" class="print secondary">PRINT RECEIPT</button>';

  const status=box.querySelector(".orderStatus");
  status.value=o.status||"Received";
  box.querySelector(".orderPaid").value=o.paid||0;

  box.querySelector(".update").addEventListener("click",()=>{
   const newPaid=Number(box.querySelector(".orderPaid").value);
   if(!Number.isFinite(newPaid)||newPaid<0||newPaid>o.total){
    alert("Payment must be between zero and the order total.");return;
   }
   o.status=status.value;
   o.paid=newPaid;
   if(persist())renderOrders();
  });

  box.querySelector(".print").addEventListener("click",()=>{
   const w=window.open("","_blank");
   if(!w){alert("Allow pop-ups to print the receipt.");return;}
   const lines=(o.items||[]).map(i=>"<p>"+safe(i.name)+" × "+i.qty+" — "+money(i.qty*i.price)+"</p>").join("");
   w.document.write('<html><head><title>Receipt</title></head><body>'+
    '<h2>SPOTLESS SPIN LAUNDRY W.L.L.</h2>'+
    '<p>Order: '+String(o.id).slice(-6)+'</p>'+
    '<p>Customer: '+safe(o.customer)+'</p>'+
    '<p>Phone: '+safe(o.phone||"")+'</p>'+lines+
    '<p>Total: '+money(o.total)+'</p><p>Paid: '+money(o.paid)+'</p>'+
    '<p>Balance: '+money(o.total-o.paid)+'</p>'+
    '<p>Status: '+safe(o.status)+'</p>'+
    '<p>Thank you for choosing us!</p></body></html>');
   w.document.close();w.print();
  });
  $("orders").appendChild(box);
 });

 const sales=orders.reduce((s,o)=>s+Number(o.total||0),0);
 const paid=orders.reduce((s,o)=>s+Number(o.paid||0),0);
 $("summary").textContent="Orders: "+orders.length+
  " | Sales: "+money(sales)+" | Received: "+money(paid)+
  " | Outstanding: "+money(sales-paid);
}

$("search").addEventListener("input",renderOrders);
$("allBtn").addEventListener("click",()=>{balanceOnly=false;renderOrders();});
$("balanceBtn").addEventListener("click",()=>{balanceOnly=true;renderOrders();});

addItem();
renderOrders();
</script>
</body>
</html>
