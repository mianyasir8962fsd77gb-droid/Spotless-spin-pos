<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087443">
<title>SPOTLESS SPIN LAUNDRY POS</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f6f3;color:#17372a}
header{background:#087443;color:white;padding:22px 16px}
header h1{font-size:22px;margin:0 0 6px}
header p{margin:0;font-size:13px}
main{max-width:800px;margin:auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat,.panel{background:white;padding:14px;border-radius:12px;box-shadow:0 2px 8px #0000000b}
.stat strong{display:block;font-size:19px;margin-top:8px;overflow-wrap:anywhere}
.stat span{font-size:12px;color:#60766a}
h2{font-size:18px;margin:0 0 14px}
.panel{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:bold;margin:11px 0 5px}
input,select{width:100%;padding:12px;border:1px solid #ccd9d0;border-radius:8px;background:white;font-size:16px;color:#17372a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:8px;padding:12px;font-size:14px;font-weight:bold;cursor:pointer}
.primary{background:#087443;color:white;width:100%;margin-top:15px}
.secondary{background:#e4f3e9;color:#08653b}
.danger{background:#fff0ed;color:#a72b20}
.order{border:1px solid #e0e9e3;padding:12px;border-radius:9px;margin-top:10px}
.orderhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.order p{font-size:13px;line-height:1.5;margin:8px 0}
.order select{margin-top:7px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.actions button{flex:1}
.muted{color:#65796d;font-size:12px}
.empty{color:#65796d;text-align:center;padding:20px}
footer{text-align:center;padding:16px;color:#65796d;font-size:12px}
@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
@media print{header, .no-print, footer{display:none!important}body{background:white}main{padding:0}.panel,.stat{box-shadow:none}}
</style>
</head>
<body>
<header>
<h1>SPOTLESS SPIN</h1>
<p>LAUNDRY W.L.L. · POINT OF SALE</p>
<p>Kingdom of Bahrain · BHD</p>
</header>
<main>
<div class="stats">
<div class="stat"><span>Total Orders</span><strong id="totalOrders">0</strong></div>
<div class="stat"><span>In Progress</span><strong id="activeOrders">0</strong></div>
<div class="stat"><span>Total Sales</span><strong id="totalSales">BHD 0.000</strong></div>
</div>

<section class="panel no-print">
<h2>Create New Order</h2>
<form id="orderForm">
<div class="grid">
<div><label for="customer">Customer Name *</label><input id="customer" required placeholder="Customer name"></div>
<div><label for="phone">Phone Number</label><input id="phone" type="tel" placeholder="Phone number"></div>
</div>
<label for="service">Laundry Service *</label>
<select id="service" required>
<option value="Wash & Fold|1.000">Wash & Fold</option>
<option value="Wash & Iron|1.500">Wash & Iron</option>
<option value="Ironing Only|0.500">Ironing Only</option>
<option value="Dry Cleaning|2.000">Dry Cleaning</option>
<option value="Blanket Cleaning|3.000">Blanket Cleaning</option>
<option value="Abaya Cleaning|1.500">Abaya Cleaning</option>
<option value="Other|0">Other / Custom Price</option>
</select>
<div class="grid">
<div><label for="qty">Quantity</label><input id="qty" type="number" min="1" value="1" required></div>
<div><label for="price">Unit Price (BHD)</label><input id="price" type="number" min="0" step="0.001" value="1.000" required></div>
</div>
<label for="notes">Notes / Special Instructions</label>
<input id="notes" placeholder="Optional">
<label for="due">Expected Delivery Date</label>
<input id="due" type="date">
<div style="margin-top:14px">Order total: <strong id="estimate">BHD 1.000</strong></div>
<button class="primary" type="submit">+ Create Laundry Order</button>
</form>
</section>

<section class="panel">
<h2>Order Management</h2>
<div class="no-print">
<label for="search">Search Orders</label>
<input id="search" placeholder="Order number, name or phone">
<label for="filter">Filter by Status</label>
<select id="filter">
<option value="">All Orders</option>
<option>Received</option>
<option>Washing</option>
<option>Ready</option>
<option>Delivered</option>
</select>
</div>
<div id="orders"><div class="empty">No orders yet. Create your first order above.</div></div>
</section>
<footer>SPOTLESS SPIN LAUNDRY W.L.L. · POS</footer>
</main>

<script>
const $=id=>document.getElementById(id);
const money=n=>'BHD '+Number(n).toFixed(3);
const today=()=>new Date().toISOString().slice(0,10);
let orders=[];
try{orders=JSON.parse(localStorage.getItem('spotlessSpinOrders')||'[]')}catch(e){orders=[]}

function save(){
 try{
 localStorage.setItem('spotlessSpinOrders',JSON.stringify(orders));
 }catch(e){alert('Could not save on this device. Please check your browser storage.')}
 render();
}
function updateEstimate(){
 const q=Math.max(0,Number($('qty').value)||0);
 const p=Math.max(0,Number($('price').value)||0);
 $('estimate').textContent=money(q*p);
}
$('service').addEventListener('change',()=>{
 const parts=$('service').value.split('|');
 if(parts[0]==='Other')$('price').value='0.000';
 else $('price').value=Number(parts[1]).toFixed(3);
 updateEstimate();
});
$('qty').addEventListener('input',updateEstimate);
$('price').addEventListener('input',updateEstimate);

$('orderForm').addEventListener('submit',e=>{
 e.preventDefault();
 const qty=Number($('qty').value);
 const price=Number($('price').value);
 if(qty<1||price<0||!Number.isFinite(qty)||!Number.isFinite(price)){
 alert('Please enter a valid quantity and price.');return;
 }
 const service=$('service').value.split('|')[0];
 const next=Math.max(0,...orders.map(o=>Number(o.id)||0))+1;
 orders.unshift({
 id:next,customer:$('customer').value.trim(),
 phone:$('phone').value.trim(),service,qty,price,
 total:qty*price,notes:$('notes').value.trim(),
 due:$('due').value,status:'Received',
 date:new Date().toLocaleString()
 });
 save();
 $('orderForm').reset();
 $('qty').value=1;$('price').value='1.000';
 updateEstimate();
 alert('Order #'+String(next).padStart(4,'0')+' created successfully!');
});

function escapeHTML(s){
 return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function render(){
 $('totalOrders').textContent=orders.length;
 $('activeOrders').textContent=orders.filter(o=>o.status!=='Delivered').length;
 $('totalSales').textContent=money(orders.filter(o=>o.status==='Delivered').reduce((s,o)=>s+Number(o.total||0),0));
 const query=$('search').value.toLowerCase();
 const status=$('filter').value;
 const list=orders.filter(o=>
 (!status||o.status===status)&&
 [o.id,o.customer,o.phone,o.service].some(v=>String(v||'').toLowerCase().includes(query))
 );
 if(!list.length){
 $('orders').innerHTML='<div class="empty">No matching orders found.</div>';return;
 }
 $('orders').innerHTML=list.map(o=>`
 <article class="order">
 <div class="orderhead">
 <strong>Order #${String(o.id).padStart(4,'0')}</strong>
 <strong>${money(o.total)}</strong>
 </div>
 <p><strong>${escapeHTML(o.customer)}</strong><br>
 ${escapeHTML(o.phone||'No phone number')}<br>
 ${escapeHTML(o.service)} · Quantity: ${o.qty}<br>
 Unit price: ${money(o.price)}<br>
 <span class="muted">Created: ${escapeHTML(o.date)}</span>
 ${o.due?'<br>Due: '+escapeHTML(o.due):''}
 ${o.notes?'<br>Notes: '+escapeHTML(o.notes):''}</p>
 <label>Status</label>
 <select class="no-print" onchange="changeStatus(${o.id},this.value)">
 ${['Received','Washing','Ready','Delivered'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}
 </select>
 <p><strong>Status:</strong> ${escapeHTML(o.status)}</p>
 <div class="actions no-print">
 <button class="secondary" onclick="receipt(${o.id})">Print Receipt</button>
 <button class="danger" onclick="deleteOrder(${o.id})">Delete</button>
 </div>
 </article>`).join('');
}
function changeStatus(id,status){
 const o=orders.find(o=>o.id===id);
 if(o){o.status=status;save();}
}
function deleteOrder(id){
 if(!confirm('Delete this order permanently from this device?'))return;
 orders=orders.filter(o=>o.id!==id);save();
}
function receipt(id){
 const o=orders.find(o=>o.id===id);if(!o)return;
 const w=window.open('','_blank','width=400,height=600');
 if(!w){alert('Allow pop-ups in your browser to print receipts.');return;}
 w.document.write(`<!DOCTYPE html><html><head><title>Receipt</title>
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <style>body{font-family:Arial;padding:20px;color:#17372a}h2{text-align:center}hr{border:0;border-top:1px dashed #888}p{line-height:1.6}.total{font-size:20px;font-weight:bold}</style>
 </head><body><h2>SPOTLESS SPIN</h2><center>LAUNDRY W.L.L.<br>Kingdom of Bahrain</center><hr>
 <p>Receipt / Order #${String(o.id).padStart(4,'0')}<br>Date: ${escapeHTML(o.date)}<br>
 Customer: ${escapeHTML(o.customer)}<br>Phone: ${escapeHTML(o.phone||'-')}</p><hr>
 <p>Service: ${escapeHTML(o.service)}<br>Quantity: ${o.qty}<br>Unit Price: ${money(o.price)}</p><hr>
 <p class="total">TOTAL: ${money(o.total)}</p>
 <p>Status: ${escapeHTML(o.status)}</p><center>Thank you for choosing us!</center>
 <script>window.onload=()=>window.print();<\/script></body></html>`);
 w.document.close();
}
$('search').addEventListener('input',render);
$('filter').addEventListener('change',render);
updateEstimate();
render();
</script>
</body>
</html>
